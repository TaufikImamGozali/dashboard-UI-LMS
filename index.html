<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236C5CE7'%3E%3Cpath d='M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Coursue is an intuitive e-learning and LMS dashboard to track your progress, lessons, and mentor sessions." />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('coursue_theme') || 'system';
          const dark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.accent = localStorage.getItem('coursue_accent') || 'purple';
        } catch { /* Use light mode when storage is unavailable. */ }
      })();
    </script>
    <title>Coursue - Online Learning Platform & Dashboard</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      #app-splash-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      .dark #app-splash-preloader {
        background-color: #0b0f19;
        color: #f1f5f9;
      }
      html:not(.dark) #app-splash-preloader {
        background-color: #f8fafc;
        color: #0f172a;
      }
      .splash-logo-box {
        position: relative;
        width: 68px;
        height: 68px;
        border-radius: 20px;
        background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.45);
        animation: splashPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .splash-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2.5px solid rgba(124, 58, 237, 0.2);
        border-top-color: #7c3aed;
        animation: splashSpin 0.75s linear infinite;
        margin-top: 20px;
      }
      .dark .splash-spinner {
        border-color: rgba(167, 139, 250, 0.2);
        border-top-color: #a78bfa;
      }
      @keyframes splashSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.92; }
      }
      .splash-title {
        margin-top: 14px;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #7c3aed, #6366f1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash-subtitle {
        margin-top: 10px;
        font-size: 12px;
        font-weight: 600;
        color: #94a3b8;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body class="min-h-screen bg-brand-bg font-sans text-slateText-primary antialiased">
    <div id="root">
      <div id="app-splash-preloader">
        <div class="splash-logo-box">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
          </svg>
        </div>
        <div class="splash-title">Coursue</div>
        <div class="splash-spinner"></div>
        <div class="splash-subtitle">Memuat platform pembelajaran...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
